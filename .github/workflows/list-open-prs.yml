name: List Open PRs

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: read
  pull-requests: read

jobs:
  list-open-prs:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PR reporter
        run: pnpm --filter pr-open-report build

      - name: Generate PR report data
        run: pnpm list-open-prs

      - name: Upload PR report artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-prs-json
          path: apps/pages-stats/src/generated/open-prs.json
          if-no-files-found: error
          retention-days: 7