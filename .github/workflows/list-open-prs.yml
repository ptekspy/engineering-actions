name: List Open PRs

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 7-23 * * *"

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  list-open-prs:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Pages
        uses: actions/configure-pages@v5
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PR reporter
        run: pnpm --filter pr-open-report build

      - name: Generate PR report and Pages site
        env:
          PAGES_OUTPUT_DIR: site
        run: pnpm list-open-prs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4