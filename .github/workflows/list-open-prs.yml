name: List Open PRs

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 7-23 * * *"

permissions:
  contents: read
  pull-requests: read

jobs:
  list-open-prs:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.0.0
          cache: true

      - name: Build PR reporter
        run: pnpm build -- --filter=@engineering-actions/pr-open-report

      - name: List open PRs
        run: pnpm list-open-prs